<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title id="top"></title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }
        :root {
            color-scheme: light dark;
            --blocked-bg: #101216;
            --blocked-surface: #171b22;
            --blocked-border: #323b4b;
            --blocked-text: #ffffff;
            --blocked-heading: #ff4444;
            --blocked-muted: #c3cad6;
            --blocked-shadow: 0 18px 44px rgba(0, 0, 0, 0.28);
        }
        [data-theme="dark"] {
            color-scheme: dark;
        }
        [data-theme="light"] {
            color-scheme: light;
            --blocked-bg: #f5f7fb;
            --blocked-surface: #ffffff;
            --blocked-border: #cfd6e2;
            --blocked-text: #17202e;
            --blocked-heading: #c73535;
            --blocked-muted: #526173;
            --blocked-shadow: 0 18px 40px rgba(25, 37, 59, 0.12);
        }
        #blockDiv {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: var(--blocked-bg);
            color: var(--blocked-text);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
            font: 16px/1.5 Arial, sans-serif;
            box-shadow: var(--blocked-shadow);
            z-index: 2147483647;
        }
        #contentDiv {
            width: min(620px, calc(100vw - 48px));
            margin: 0 auto;
            padding: 30px 34px;
            background-color: var(--blocked-surface);
            border: 1px solid var(--blocked-border);
            border-radius: 8px;
            box-shadow: var(--blocked-shadow);
        }
        h1 {
            margin: 0 0 16px;
            color: var(--blocked-heading);
            font-size: 32px;
            line-height: 1.15;
        }
        p {
            margin: 0;
            color: var(--blocked-muted);
            font-size: 18px;
        }
        #countdown {
            font-size: 48px;
            margin-top: 20px;
        }
        #pomodoroBlockPanel {
            margin-top: 18px;
            padding-top: 14px;
            border-top: 1px solid var(--blocked-border);
            text-align: left;
        }
        #pomodoroBlockPanel[hidden] {
            display: none;
        }
        #pomodoroBlockPhase {
            margin: 0 0 6px;
            color: var(--blocked-text);
            font-size: 15px;
            font-weight: 700;
        }
        #pomodoroBlockTimer {
            display: inline-block;
            margin-right: 8px;
            color: #3d8bfd;
            font-size: 22px;
            font-weight: 700;
            line-height: 1;
        }
        #pomodoroBlockMessage {
            color: var(--blocked-muted);
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div id="blockDiv">
        <div id="contentDiv">
            <h1 id="title"></h1>
            <p id="message"></p>
            <div id="pomodoroBlockPanel" hidden>
                <p id="pomodoroBlockPhase">Pomodoro</p>
                <span id="pomodoroBlockTimer">0:00</span>
                <span id="pomodoroBlockMessage"></span>
            </div>
        </div>
    </div>
    <script type="module" src="js/blockedScript.js"></script>
</body>
</html>

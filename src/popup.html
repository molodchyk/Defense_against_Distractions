<!DOCTYPE html>
<html lang="en">
<head>
    <title>Defense against Distractions</title>
    <link rel="stylesheet" href="css/popup.css">
    <meta charset="UTF-8">
</head>
<body>
    <main class="popup-shell">
        <header>
            <div class="popup-header-row">
                <p>Defense against Distractions</p>
                <button id="headerOptionsButton" class="header-options-button" type="button" title="Open Options">DaD</button>
            </div>
            <h1>Quick Actions</h1>
        </header>

        <label for="matchStrategySelect">Match strategy</label>
        <select id="matchStrategySelect">
            <option value="samePosition">Same position in repeated UI</option>
            <option value="similar">Similar structure</option>
            <option value="exact">Closest match</option>
        </select>

        <label for="minimumScoreInput">Minimum score</label>
        <input id="minimumScoreInput" type="number" min="6" max="24" value="12">

        <label for="ancestorDepthInput">Ancestor depth</label>
        <input id="ancestorDepthInput" type="number" min="0" max="6" value="2">

        <label for="labelMatchSelect">Label match</label>
        <select id="labelMatchSelect">
            <option value="prefer">Prefer label</option>
            <option value="ignore">Ignore label</option>
            <option value="require">Require label</option>
        </select>

        <button id="pickElementButton">Pick UI Element</button>
        <button id="openOptionsButton" class="secondary-button">Open Options</button>
        <p id="statusText" role="status"></p>
    </main>

    <script src="js/popup.js" type="module"></script>
</body>
</html>
